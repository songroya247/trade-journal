<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZONE FLIP™ — Scenario Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="assets/config.js"></script>
<style>
  :root{
    --bg: #FBFBFE;
    --panel: #FFFFFF;
    --line: #E6E4F5;
    --text: #16152B;
    --muted: #767492;
    --violet: #5B4CFF;
    --violet-light: #EFEBFF;
    --emerald: #0EBE7F;
    --emerald-light: #E3FBF1;
    --coral: #FF4E63;
    --coral-light: #FFE9EC;
    --amber: #FF9F0A;
    --amber-light: #FFF3DE;
    --gold: #FFB800;
    --display: 'Sora', sans-serif;
    --sans: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 600px 360px at 10% -10%, rgba(91,76,255,0.09), transparent),
      radial-gradient(ellipse 600px 360px at 100% 0%, rgba(255,78,99,0.07), transparent),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.45;
  }
  ::selection{background:var(--violet); color:#fff;}
  button{font:inherit;}

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:16px 16px 22px;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{
    font-family:var(--display); font-weight:800; font-size:15px;
    display:flex; align-items:center; gap:7px;
  }
  .brand .dot{width:6px; height:6px; border-radius:50%; background:var(--violet); animation:pulse 2s infinite;}
  .brand .tm{color:var(--violet); font-size:11px; vertical-align:top;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,76,255,.5);}70%{box-shadow:0 0 0 6px rgba(91,76,255,0);}100%{box-shadow:0 0 0 0 rgba(91,76,255,0);}}

  .toggle-row{display:flex; gap:6px;}
  .trail-toggle{
    font-family:var(--mono); font-size:10.5px; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:99px;
    padding:6px 11px; cursor:pointer; display:flex; align-items:center; gap:5px;
  }
  .trail-toggle:hover{border-color:var(--violet); color:var(--violet);}
  .trail-toggle.active{border-color:var(--violet); color:var(--violet); background:var(--violet-light);}
  .trail-toggle .chev{transition:transform .2s ease; font-size:9px;}
  .trail-toggle.open .chev{transform:rotate(180deg);}

  #trail-strip, #wireframe-strip, #stats-strip{
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .25s ease, opacity .2s ease, margin .25s ease;
  }
  #trail-strip.open{max-height:60px; opacity:1; margin-bottom:12px;}
  #wireframe-strip.open{max-height:180px; opacity:1; margin-bottom:12px;}
  #stats-strip.open{max-height:460px; opacity:1; margin-bottom:12px;}

  .trail-pills{display:flex; gap:6px; flex-wrap:wrap;}
  .trail-pill{
    font-family:var(--mono); font-size:10.5px; padding:5px 10px; border-radius:99px;
    background:var(--violet-light); color:var(--violet); font-weight:600;
  }
  .trail-pill.empty{background:var(--panel); border:1px dashed var(--line); color:var(--muted); font-weight:500;}

  .wireframe-card, .stats-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 10px;
  }
  .stats-card{padding:14px; max-height:440px; overflow-y:auto;}

  .wireframe{display:flex; align-items:center; gap:2px; overflow-x:auto;}
  .wf-col{display:flex; flex-direction:column; gap:5px; min-width:64px; flex:1;}
  .wf-col-label{font-family:var(--mono); font-size:8px; color:var(--muted); text-align:center; letter-spacing:.05em; margin-bottom:2px;}
  .wf-node{
    border-radius:7px; padding:5px 3px; text-align:center;
    font-family:var(--mono); font-size:9.5px; font-weight:700;
    border:1.5px dashed var(--line); color:var(--muted); background:var(--bg);
    transition:all .2s ease;
  }
  .wf-node.chosen{border-style:solid; color:#fff;}
  .wf-node.chosen.c-violet{background:var(--violet); border-color:var(--violet);}
  .wf-node.chosen.c-emerald{background:var(--emerald); border-color:var(--emerald);}
  .wf-node.chosen.c-coral{background:var(--coral); border-color:var(--coral);}
  .wf-node.discarded{opacity:.3; text-decoration:line-through;}
  .wf-arrow{color:var(--line); font-size:13px; flex-shrink:0; padding:0 1px;}
  .wf-arrow.active{color:var(--violet);}
  .wf-result-node{
    border-radius:7px; padding:5px 6px; text-align:center;
    font-family:var(--mono); font-size:9.5px; font-weight:700;
    border:1.5px dashed var(--line); color:var(--muted); background:var(--bg);
  }
  .wf-result-node.ready{border-style:solid; border-color:var(--gold); background:var(--gold); color:#3a2a00;}

  .stats-summary{display:flex; gap:6px; margin-bottom:12px;}
  .stats-summary-item{flex:1; background:var(--violet-light); border-radius:10px; padding:8px 4px; text-align:center;}
  .ss-val{font-family:var(--display); font-weight:800; font-size:15px; color:var(--violet); line-height:1.1;}
  .ss-lbl{font-family:var(--mono); font-size:7.5px; color:var(--muted); letter-spacing:.04em; margin-top:3px;}
  .stats-rows{display:flex; flex-direction:column;}
  .stats-row{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid var(--line);}
  .stats-row:last-child{border-bottom:none;}
  .sr-num{width:22px; height:22px; border-radius:6px; background:var(--violet); color:#fff; font-family:var(--mono); font-weight:700; font-size:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .sr-num.gold{background:var(--gold); color:#3a2a00;}
  .sr-info{flex:1; min-width:0;}
  .sr-name{font-size:11px; font-weight:600; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sr-bar{height:4px; background:var(--line); border-radius:99px; overflow:hidden;}
  .sr-bar-fill{height:100%; background:var(--emerald); border-radius:99px; transition:width .3s ease;}
  .sr-stats{text-align:right; flex-shrink:0;}
  .sr-wr{font-family:var(--mono); font-weight:700; font-size:11.5px; color:var(--emerald);}
  .sr-count{font-family:var(--mono); font-size:8px; color:var(--muted); margin-top:2px; white-space:nowrap;}
  .sr-count.muted{color:var(--line); font-size:8.5px;}
  .stats-empty, .stats-loading{font-size:11.5px; color:var(--muted); text-align:center; padding:18px 8px; line-height:1.5;}

  .stats-actions{display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-top:10px;}
  .clear-log-btn, .export-log-btn, .import-log-btn{
    padding:8px 3px; border-radius:10px; font-family:var(--mono); font-size:9px; font-weight:700; cursor:pointer; text-align:center;
  }
  .clear-log-btn{border:1px dashed var(--coral); background:var(--coral-light); color:var(--coral);}
  .export-log-btn{border:1px solid var(--violet); background:var(--violet-light); color:var(--violet);}
  .import-log-btn{border:1px solid var(--emerald); background:var(--emerald-light); color:var(--emerald);}

  .progress{display:flex; gap:6px; margin-bottom:20px;}
  .progress-step{flex:1; height:5px; border-radius:99px; background:var(--line); overflow:hidden; position:relative;}
  .progress-step .fill{position:absolute; inset:0; background:var(--violet); border-radius:99px; transform:scaleX(0); transform-origin:left; transition:transform .45s cubic-bezier(.65,0,.35,1);}
  .progress-step.done .fill{transform:scaleX(1); background:var(--emerald);}
  .progress-step.active .fill{transform:scaleX(1);}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px 20px;
    box-shadow:0 16px 40px -18px rgba(91,76,255,0.18); flex:1; display:flex; flex-direction:column;
  }

  .q-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .back-btn{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;
  }
  .back-btn:disabled{opacity:0; pointer-events:none;}
  .back-btn:hover{border-color:var(--violet); color:var(--violet);}
  .q-tag{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.1em;}

  .q-title{font-family:var(--display); font-weight:700; font-size:19px; line-height:1.25; margin-bottom:6px;}
  .q-desc{color:var(--muted); font-size:13px; margin-bottom:18px;}

  .option-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; flex:1;}
  .option-btn{
    text-align:left; background:var(--panel); border:1.5px solid var(--line); border-radius:14px;
    padding:14px 12px; cursor:pointer; transition:all .15s ease; display:flex; flex-direction:column; min-height:0;
  }
  .option-btn:active{transform:scale(.97);}
  .option-btn.a{border-color:rgba(14,190,127,0.25);}
  .option-btn.b{border-color:rgba(255,78,99,0.25);}
  .option-btn.a:hover, .option-btn.a:focus-visible{border-color:var(--emerald); background:var(--emerald-light);}
  .option-btn.b:hover, .option-btn.b:focus-visible{border-color:var(--coral); background:var(--coral-light);}
  .option-btn .otag{
    display:inline-block; font-family:var(--mono); font-size:9.5px; font-weight:700;
    padding:2px 7px; border-radius:6px; margin-bottom:8px; letter-spacing:.04em; align-self:flex-start;
  }
  .option-btn.a .otag{background:var(--emerald-light); color:var(--emerald);}
  .option-btn.b .otag{background:var(--coral-light); color:var(--coral);}
  .option-btn .otitle{font-weight:700; font-size:13.5px; margin-bottom:5px; line-height:1.25;}
  .option-btn .odesc{font-size:11.3px; color:var(--muted); line-height:1.45;}

  .candidates-hint{margin-top:14px; font-family:var(--mono); font-size:10.5px; color:var(--muted); text-align:center;}
  .candidates-hint b{color:var(--violet);}

  #result-panel{display:none; flex:1; flex-direction:column;}
  .result-header{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .result-num{
    font-family:var(--display); font-weight:800; font-size:26px; width:48px; height:48px; border-radius:13px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; background:var(--violet); color:#fff;
  }
  .result-num.gold{background:var(--gold); color:#3a2a00;}
  .result-title .rt-tag{font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:.08em;}
  .result-title h2{font-family:var(--display); font-size:17.5px; font-weight:700; margin-top:2px; line-height:1.25;}

  .result-narrative{font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line);}

  .result-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
  .result-block{border-radius:12px; padding:10px 11px;}
  .result-block.zone{background:var(--violet-light);}
  .result-block.target{background:var(--emerald-light);}
  .result-block.sl{background:var(--coral-light);}
  .result-block.conf{background:var(--amber-light);}
  .result-block .rb-label{font-family:var(--mono); font-size:8.5px; letter-spacing:.08em; color:var(--muted); margin-bottom:3px; text-transform:uppercase;}
  .result-block.zone .rb-label{color:var(--violet);}
  .result-block.target .rb-label{color:var(--emerald);}
  .result-block.sl .rb-label{color:var(--coral);}
  .result-block.conf .rb-label{color:#8a5b00;}
  .result-block .rb-value{font-size:11.8px; font-weight:600; line-height:1.35;}

  .result-risk{
    background:var(--amber-light); border-radius:12px; padding:9px 11px;
    display:flex; gap:7px; align-items:flex-start; margin-top:6px; font-size:11.5px; color:#7a5200; line-height:1.4;
  }

  .conf-selector-box{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
  .cs-title{font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:.07em; margin-bottom:7px; text-align:center;}
  .cs-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .cs-btn{
    padding:8px 6px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel);
    font-family:var(--mono); font-size:9.5px; font-weight:700; color:var(--muted); cursor:pointer; text-align:center; transition:all .15s ease;
  }
  .cs-btn.active.tight{border-color:var(--violet); background:var(--violet-light); color:var(--violet);}
  .cs-btn.active.wide{border-color:var(--amber); background:var(--amber-light); color:#8a5b00;}

  .log-section{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
  .log-label{font-family:var(--mono); font-size:9.5px; color:var(--muted); letter-spacing:.07em; margin-bottom:8px; text-align:center;}
  .log-buttons{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px;}
  .log-btn{
    padding:10px 3px; border-radius:11px; border:1.5px solid var(--line); background:var(--panel);
    font-family:var(--mono); font-weight:700; font-size:10.5px; cursor:pointer; text-align:center; transition:all .15s ease;
  }
  .log-btn:active{transform:scale(.95);}
  .log-btn.win{color:var(--emerald); border-color:rgba(14,190,127,.3);}
  .log-btn.win:hover{background:var(--emerald-light); border-color:var(--emerald);}
  .log-btn.loss{color:var(--coral); border-color:rgba(255,78,99,.3);}
  .log-btn.loss:hover{background:var(--coral-light); border-color:var(--coral);}
  .log-btn.be{color:var(--muted); border-color:var(--line);}
  .log-btn.be:hover{background:var(--bg); border-color:var(--muted);}
  .log-confirm{margin-top:8px; font-size:11px; color:var(--muted); text-align:center; display:flex; align-items:center; justify-content:center; gap:7px; min-height:14px;}
  .undo-btn{font-family:var(--mono); font-size:9.5px; color:var(--violet); background:none; border:none; text-decoration:underline; cursor:pointer;}

  .reset-btn{margin-top:auto; padding-top:12px;}
  .reset-btn button{
    width:100%; padding:12px; border-radius:12px; background:var(--text); color:#fff; border:none; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .reset-btn button:hover{opacity:.85;}

  .fade-in{animation:fadeIn .3s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);}}

  /* ==== Nav + Auth (added for standalone page) ==== */
  .app-nav{display:flex; gap:6px; margin-bottom:14px;}
  .app-nav-link{
    flex:1; text-align:center; font-family:var(--mono); font-size:10.5px; font-weight:600;
    padding:9px 8px; border-radius:10px; border:1px solid var(--line); background:var(--panel);
    color:var(--muted); text-decoration:none;
  }
  .app-nav-link.active{border-color:var(--violet); background:var(--violet-light); color:var(--violet);}

  .auth-wrap{max-width:480px; margin:40px auto; padding:0 16px;}
  .auth-box{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px 20px; box-shadow:0 16px 40px -18px rgba(91,76,255,0.18);}
  .auth-box h2{font-family:var(--display); font-size:19px; font-weight:700; margin-bottom:6px;}
  .auth-box p{color:var(--muted); font-size:12.5px; margin-bottom:16px;}
  .auth-box input{
    width:100%; padding:11px 12px; margin-bottom:10px; border:1.5px solid var(--line); border-radius:12px;
    background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13.5px;
  }
  .auth-box button{
    width:100%; padding:12px; background:var(--violet); color:#fff; border:none; border-radius:12px;
    font-family:var(--sans); font-weight:600; font-size:13.5px; cursor:pointer; margin-top:4px;
  }
  .auth-toggle{text-align:center; margin-top:12px; font-size:12px; color:var(--muted);}
  .auth-toggle a{color:var(--violet); cursor:pointer; text-decoration:underline; font-weight:600;}
  .auth-msg{font-size:12px; margin-top:10px;}
  .auth-msg.err{color:var(--coral);}
  .auth-msg.ok{color:var(--emerald);}
  .signout-row{text-align:right; margin-bottom:8px;}
  .signout-link{font-family:var(--mono); font-size:10px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:none;}
</style>

</head>
<body>

<div class="app" id="authScreen">
  <div class="app-nav">
    <a href="index.html" class="app-nav-link">📒 Ledger</a>
    <a href="zone-flip.html" class="app-nav-link active">🎯 Zone Flip</a>
  </div>
  <div class="auth-wrap" style="margin:20px auto 0;">
    <div class="auth-box">
      <h2 id="authTitle">Sign in</h2>
      <p id="authSub">Sign in with the same account you use for the Ledger — your Zone Flip log is tied to it.</p>
      <input type="text" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Password">
      <button id="authSubmit">Sign in</button>
      <div class="auth-toggle">
        <span id="authToggleText">No account yet?</span> <a id="authToggleLink">Sign up</a>
      </div>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>
</div>

<div class="app" id="app" style="display:none;">

  <div class="app-nav">
    <a href="index.html" class="app-nav-link">📒 Ledger</a>
    <a href="zone-flip.html" class="app-nav-link active">🎯 Zone Flip</a>
  </div>

  <div class="signout-row"><button class="signout-link" id="signOutBtn">Sign out</button></div>

  <div class="topbar">
    <div class="brand"><span class="dot"></span>ZONE FLIP<span class="tm">™</span></div>
    <div class="toggle-row">
      <button class="trail-toggle" id="statsToggle" onclick="setPanel('stats')"><span>STATS</span><span class="chev">▾</span></button>
      <button class="trail-toggle" id="wireframeToggle" onclick="setPanel('wireframe')"><span>PATH</span><span class="chev">▾</span></button>
      <button class="trail-toggle" id="trailToggle" onclick="setPanel('trail')"><span id="trailToggleLabel">STEPS</span><span class="chev">▾</span></button>
    </div>
  </div>

  <div id="stats-strip"><div class="stats-card" id="statsBody"></div></div>
  <div id="wireframe-strip"><div class="wireframe-card"><div class="wireframe" id="wireframeDiagram"></div></div></div>
  <div id="trail-strip"><div class="trail-pills" id="trailPills"></div></div>

  <div class="progress">
    <div class="progress-step" id="pstep-0"><div class="fill"></div></div>
    <div class="progress-step" id="pstep-1"><div class="fill"></div></div>
    <div class="progress-step" id="pstep-2"><div class="fill"></div></div>
  </div>

  <div class="card">
    <div id="question-panel"></div>
    <div id="result-panel"></div>
  </div>

  <!-- Hidden File Input for Importing CSV/JSON -->
  <input type="file" id="importFileInput" accept=".json,.csv" style="display:none" onchange="importData(event)">

</div>

<script>
// supabaseClient comes from assets/config.js (loaded in <head>)

// ---------------- Auth ----------------
let currentUser = null;
let isSignUpMode = false;

const authScreen = document.getElementById('authScreen');
const app = document.getElementById('app');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authSubmit = document.getElementById('authSubmit');
const authMsg = document.getElementById('authMsg');
const authTitle = document.getElementById('authTitle');
const authToggleText = document.getElementById('authToggleText');
const authToggleLink = document.getElementById('authToggleLink');

authToggleLink.addEventListener('click', () => {
  isSignUpMode = !isSignUpMode;
  authTitle.textContent = isSignUpMode ? 'Create account' : 'Sign in';
  authSubmit.textContent = isSignUpMode ? 'Sign up' : 'Sign in';
  authToggleText.textContent = isSignUpMode ? 'Already have an account?' : 'No account yet?';
  authToggleLink.textContent = isSignUpMode ? 'Sign in' : 'Sign up';
  authMsg.textContent = '';
});

authSubmit.addEventListener('click', async () => {
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if(!email || !password){ authMsg.textContent = 'Enter email and password.'; authMsg.className = 'auth-msg err'; return; }
  authSubmit.disabled = true;
  authMsg.textContent = '';
  try{
    if(isSignUpMode){
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if(error) throw error;
      authMsg.textContent = 'Account created. Check your email if confirmation is required, then sign in.';
      authMsg.className = 'auth-msg ok';
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
  } catch(err){
    authMsg.textContent = err.message || 'Something went wrong.';
    authMsg.className = 'auth-msg err';
  } finally {
    authSubmit.disabled = false;
  }
});

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();

let answers = [];
let openPanel = null;
let lastLoggedId = null;
let selectedConfluence = 'tight';

const panelMap = {
  trail: ['trail-strip', 'trailToggle'],
  wireframe: ['wireframe-strip', 'wireframeToggle'],
  stats: ['stats-strip', 'statsToggle'],
};

function setPanel(name){
  openPanel = (openPanel === name) ? null : name;
  Object.keys(panelMap).forEach(key => {
    const [stripId, btnId] = panelMap[key];
    const isOpen = openPanel === key;
    document.getElementById(stripId).classList.toggle('open', isOpen);
    document.getElementById(btnId).classList.toggle('open', isOpen);
    document.getElementById(btnId).classList.toggle('active', isOpen);
  });
  document.getElementById('trailToggleLabel').textContent = openPanel === 'trail' ? 'HIDE' : 'STEPS';
  if(openPanel === 'trail') renderTrailPills();
  if(openPanel === 'wireframe') renderWireframe();
  if(openPanel === 'stats') renderStats();
}

function renderTrailPills(){
  const el = document.getElementById('trailPills');
  if(answers.length === 0){
    el.innerHTML = '<span class="trail-pill empty">No answers yet</span>';
  } else {
    el.innerHTML = answers.map(a => `<span class="trail-pill">${a}</span>`).join('');
  }
}

const wfColors = ['c-violet','c-emerald','c-coral'];

function renderWireframe(){
  if(openPanel !== 'wireframe') return;
  const el = document.getElementById('wireframeDiagram');
  let html = '';
  questions.forEach((q, i) => {
    const answered = i < answers.length;
    const current = i === answers.length;
    const chosenVal = answered ? answers[i] : null;
    const color = wfColors[i];
    const colLabel = q.key === 'C' ? 'PT C' : q.key === 'S' ? 'SPACE' : 'MID B';
    html += `<div class="wf-col">
      <div class="wf-col-label">${colLabel}</div>
      <div class="wf-node ${chosenVal === q.a.value ? 'chosen '+color : (answered ? 'discarded' : '')}">${q.a.value}</div>
      <div class="wf-node ${chosenVal === q.b.value ? 'chosen '+color : (answered ? 'discarded' : '')}">${q.b.value}</div>
    </div>`;
    html += `<div class="wf-arrow ${answered || current ? 'active' : ''}">›</div>`;
  });
  const done = answers.length === 3;
  const resultLabel = done ? '#' + scenarios[answers.join('-')].n : '?';
  html += `<div class="wf-col">
    <div class="wf-col-label">RESULT</div>
    <div class="wf-result-node ${done ? 'ready' : ''}">${resultLabel}</div>
  </div>`;
  el.innerHTML = html;
}

function renderProgress(){
  for(let i=0;i<3;i++){
    const step = document.getElementById('pstep-'+i);
    step.classList.remove('active','done');
    if(i < answers.length) step.classList.add('done');
    else if(i === answers.length) step.classList.add('active');
  }
}

function candidateCount(){
  if(answers.length === 0) return 8;
  return Object.keys(scenarios).filter(k => {
    const parts = k.split('-');
    return answers.every((a,i) => parts[i] === a);
  }).length;
}

function renderQuestion(){
  document.getElementById('result-panel').style.display = 'none';
  const panel = document.getElementById('question-panel');
  panel.style.display = 'flex';
  panel.style.flexDirection = 'column';
  panel.style.flex = '1';
  const q = questions[answers.length];
  panel.innerHTML = `
    <div class="fade-in" style="display:flex; flex-direction:column; flex:1;">
      <div class="q-head">
        <button class="back-btn" onclick="goBack()" ${answers.length===0 ? 'disabled':''}>&larr;</button>
        <span class="q-tag">${q.tag}</span>
      </div>
      <div class="q-title">${q.title}</div>
      <div class="q-desc">${q.desc}</div>
      <div class="option-grid">
        <button class="option-btn a" onclick="selectAnswer('${q.key}','${q.a.value}')">
          <span class="otag">${q.a.tag}</span>
          <div class="otitle">${q.a.title}</div>
          <div class="odesc">${q.a.desc}</div>
        </button>
        <button class="option-btn b" onclick="selectAnswer('${q.key}','${q.b.value}')">
          <span class="otag">${q.b.tag}</span>
          <div class="otitle">${q.b.title}</div>
          <div class="odesc">${q.b.desc}</div>
        </button>
      </div>
      <div class="candidates-hint"><b>${candidateCount()}</b> of 8 scenarios still match</div>
    </div>

}

function selectAnswer(key, value){
  answers.push(value);
  renderProgress();
  if(openPanel === 'trail') renderTrailPills();
  if(openPanel === 'wireframe') renderWireframe();
  if(answers.length === 3) renderResult();
  else renderQuestion();
}

function goBack(){
  answers.pop();
  renderProgress();
  if(openPanel === 'trail') renderTrailPills();
  if(openPanel === 'wireframe') renderWireframe();
  renderQuestion();
}

function setConfluence(type){
  selectedConfluence = type;
  document.getElementById('confBtnTight').classList.toggle('active', type === 'tight');
  document.getElementById('confBtnWide').classList.toggle('active', type === 'wide');
}

function resetTool(){
  answers = [];
  renderProgress();
  if(openPanel === 'trail') renderTrailPills();
  if(openPanel === 'wireframe') renderWireframe();
  renderQuestion();
}

// ---------- PERSISTENT STORAGE (Supabase: zone_flip_logs) ----------
async function loadTrades(){
  if(!currentUser) return [];
  try{
    const { data, error } = await supabaseClient
      .from('zone_flip_logs')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: true });
    if(error) throw error;
    return (data || []).map(r => ({
      id: r.id,
      scenario: r.scenario,
      outcome: r.outcome,
      confluence: r.confluence || 'tight',
      answers: r.answers || [],
      ts: r.created_at ? new Date(r.created_at).getTime() : Date.now()
    }));
  }catch(e){
    console.error('Error loading trades:', e);
    return [];
  }
}

async function logTrade(scenarioNum, outcome){
  const confirmEl = document.getElementById('logConfirm');
  if(!currentUser){
    if(confirmEl) confirmEl.innerHTML = '<span>Sign in to log trades.</span>';
    return;
  }
  if(confirmEl) confirmEl.innerHTML = '<span>Saving…</span>';
  try{
    const { data, error } = await supabaseClient
      .from('zone_flip_logs')
      .insert({
        user_id: currentUser.id,
        scenario: scenarioNum,
        outcome: outcome,
        confluence: selectedConfluence,
        answers: answers.slice()
      })
      .select()
      .single();
    if(error) throw error;
    lastLoggedId = data.id;
    const labelMap = { win:'WIN (F)', loss:'LOSS (NF)', be:'BREAK-EVEN' };
    if(confirmEl){
      confirmEl.innerHTML = `<span>✓ Logged as ${labelMap[outcome]} (${selectedConfluence.toUpperCase()})</span><button class="undo-btn" onclick="undoLastLog()">UNDO</button>`;
    }
    if(openPanel === 'stats') renderStats();
  }catch(e){
    console.error('Error saving trade:', e);
    if(confirmEl) confirmEl.innerHTML = '<span>Couldn\u2019t save — try again.</span>';
  }
}

async function undoLastLog(){
  if(!lastLoggedId || !currentUser) return;
  try{
    const { error } = await supabaseClient.from('zone_flip_logs').delete().eq('id', lastLoggedId);
    if(error) throw error;
  }catch(e){
    console.error('Error undoing log:', e);
  }
  lastLoggedId = null;
  const confirmEl = document.getElementById('logConfirm');
  if(confirmEl) confirmEl.innerHTML = '';
  if(openPanel === 'stats') renderStats();
}

async function clearLog(){
  if(!currentUser) return;
  if(!confirm('Clear all logged trade history? This cannot be undone.')) return;
  try{
    const { error } = await supabaseClient.from('zone_flip_logs').delete().eq('user_id', currentUser.id);
    if(error) throw error;
  }catch(e){
    console.error('Error clearing log:', e);
  }
  renderStats();
}

// ---------- EXPORT & IMPORT BACKUP SYSTEM ----------
async function exportCSV(){
  const trades = await loadTrades();
  if(trades.length === 0){ alert('No trades to export.'); return; }
  let csv = 'ID,Scenario,Outcome,Confluence,Answers,Timestamp,Date\n';
  trades.forEach(t => {
    const d = new Date(t.ts).toISOString();
    const conf = t.confluence || 'tight';
    const ans = (t.answers || []).join('+');
    csv += `"${t.id}",${t.scenario},"${t.outcome}","${conf}","${ans}",${t.ts},"${d}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `zone_flip_backtest_${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function triggerImport(){
  document.getElementById('importFileInput').click();
}

async function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!currentUser){ alert('Sign in to import trades.'); event.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const content = e.target.result;
      let newTrades = [];
      if(file.name.endsWith('.json')){
        newTrades = JSON.parse(content);
      } else if(file.name.endsWith('.csv')){
        const lines = content.trim().split('\n');
        for(let i = 1; i < lines.length; i++){
          const cols = lines[i].split(',');
          if(cols.length >= 3){
            const scenario = parseInt(cols[1]);
            const outcome = cols[2].replace(/"/g, '');
            const confluence = cols[3] ? cols[3].replace(/"/g, '') : 'tight';
            newTrades.push({ scenario, outcome, confluence, answers: [] });
          }
        }
      }
      if(Array.isArray(newTrades) && newTrades.length > 0){
        const rows = newTrades.map(t => ({
          user_id: currentUser.id,
          scenario: t.scenario,
          outcome: t.outcome,
          confluence: t.confluence || 'tight',
          answers: t.answers || []
        }));
        const { error } = await supabaseClient.from('zone_flip_logs').insert(rows);
        if(error) throw error;
        alert(`✓ Successfully imported ${rows.length} trade record(s)!`);
        renderStats();
      } else {
        alert('No valid trade records found in file.');
      }
    }catch(err){
      alert('Error parsing/importing file: ' + err.message);
    }
    event.target.value = ''; // reset file input
  };
  reader.readAsText(file);
}

function scenarioByNum(n){
  return Object.values(scenarios).find(s => s.n === n);
}

async function renderStats(){
  if(openPanel !== 'stats') return;
  const el = document.getElementById('statsBody');
  if(!currentUser){
    el.innerHTML = '<div class="stats-empty">Sign in to see your Zone Flip performance.</div>';
    return;
  }
  el.innerHTML = '<div class="stats-loading">Loading performance…</div>';
  let trades;
  try{
    trades = await loadTrades();
  }catch(e){
    el.innerHTML = '<div class="stats-empty">Couldn\u2019t load trade history.</div>';
    return;
  }
  if(openPanel !== 'stats') return;
  if(trades.length === 0){
    el.innerHTML = '<div class="stats-empty">No trades logged yet.<br>Log an outcome from any result screen to start tracking performance per scenario.</div>';
    return;
  }
  const agg = {};
  for(let i=1;i<=8;i++) agg[i] = { win:0, loss:0, be:0, total:0 };

  let tightWins = 0, tightDecided = 0;

  trades.forEach(t => {
    if(!agg[t.scenario]) agg[t.scenario] = { win:0, loss:0, be:0, total:0 };
    agg[t.scenario][t.outcome]++;
    agg[t.scenario].total++;
    if((t.confluence === 'tight' || !t.confluence) && (t.outcome === 'win' || t.outcome === 'loss')){
      tightDecided++;
      if(t.outcome === 'win') tightWins++;
    }
  });

  const totalTrades = trades.length;
  const totalWins = trades.filter(t => t.outcome === 'win').length;
  const totalLosses = trades.filter(t => t.outcome === 'loss').length;
  const decided = totalWins + totalLosses;
  const overallWR = decided ? Math.round((totalWins / decided) * 100) : 0;
  const tightWR = tightDecided ? Math.round((tightWins / tightDecided) * 100) : 0;

  let html = `<div class="stats-summary">
    <div class="stats-summary-item"><div class="ss-val">${totalTrades}</div><div class="ss-lbl">TRADES LOGGED</div></div>
    <div class="stats-summary-item"><div class="ss-val">${overallWR}%</div><div class="ss-lbl">OVERALL WR (F)</div></div>
    <div class="stats-summary-item"><div class="ss-val">${tightWR}%</div><div class="ss-lbl">TIGHT CONF WR</div></div>
  </div>`;
  html += '<div class="stats-rows">';
  for(let i=1;i<=8;i++){
    const a = agg[i];
    const s = scenarioByNum(i);
    const dec = a.win + a.loss;
    const wr = dec ? Math.round((a.win / dec) * 100) : null;
    const wrText = wr !== null ? wr + '%' : '—';
    html += `<div class="stats-row">
      <div class="sr-num ${s.gold ? 'gold' : ''}">${i}</div>
      <div class="sr-info">
        <div class="sr-name">${s.glyph} ${s.cls}</div>
        <div class="sr-bar"><div class="sr-bar-fill" style="width:${wr || 0}%"></div></div>
      </div>
      <div class="sr-stats">
        ${a.total ? `<div class="sr-wr">${wrText}</div><div class="sr-count">${a.total} · F:${a.win}/NF:${a.loss}/B:${a.be}</div>` : `<div class="sr-count muted">No data</div>`}
      </div>
    </div>`;
  }
  html += '</div>';
  html += `<div class="stats-actions">
    <button class="import-log-btn" onclick="triggerImport()">Import File</button>
    <button class="export-log-btn" onclick="exportCSV()">Export CSV</button>
    <button class="clear-log-btn" onclick="clearLog()">Clear History</button>
  </div>`;
  el.innerHTML = html;
}

// init
renderProgress();
renderQuestion();
</script>
